[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
XUI_PANEL_PORT = "8080"
XRAY_INBOUND_PORT = "8080"
# Change these before your first deploy (Railway → Variables tab):
# XUI_USERNAME = "admin"
# XUI_PASSWORD = "change-me"
# INBOUND_UUID = "df70a084-8d46-50bd-dec8-3a0f41903f3a"  # already the default, no need to set it
